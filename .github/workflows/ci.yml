# Lint, compile, tests, a production build and the dependency audit on every pull request and push to main.
# Vercel's Git integration still builds and deploys on its own; this check does not gate it.
# GitHub-hosted on purpose: the repository is public, so the minutes are free, and GitHub
# advises against self-hosted runners on public repositories.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vercel takes the major from engines.node and picks the patch itself; CI and local dev run the exact one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: lint
        run: bun x biome ci .
      - name: compile
        run: bun run compile
      - name: tests
        run: bun test
      - name: build
        run: bun run build
      # Fails on high or critical advisories only; moderate and low are listed, not blocking.
      - name: dependency audit
        run: bun audit --audit-level=high
